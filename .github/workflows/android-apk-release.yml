name: Build Android APK

on:
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      build_tasks:
        description: "Optional Gradle task override. Leave empty to build debug APKs, or signed release APKs when publishing."
        required: false
        default: ""
      release_tag:
        description: "Existing release tag to upload APKs to, for example v0.3.0-tv-low-memory-1. Leave empty to only upload workflow artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Resolve checkout ref
        id: ref
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "ref=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.release_tag }}" ]]; then
            echo "ref=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify submodules
        run: |
          git submodule status --recursive
          test -f libs/ffmpegDecoder/build.gradle.kts || test -f libs/ffmpegDecoder/build.gradle
          test -f libs/av1Decoder/build.gradle.kts || test -f libs/av1Decoder/build.gradle
          test -f libs/libVLC/build.gradle.kts || test -f libs/libVLC/build.gradle

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check release signing secrets
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          publish_release=false
          if [[ "${{ github.event_name }}" == "release" || "${{ github.ref }}" == refs/tags/* ]]; then
            publish_release=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${RELEASE_TAG}" ]]; then
            publish_release=true
          fi
          echo "publish_release=${publish_release}" >> "$GITHUB_OUTPUT"

          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing signing secret: ${name}"
              missing=1
            fi
          done

          if [[ "${missing}" -eq 0 ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are available."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            if [[ "${publish_release}" == "true" ]]; then
              echo "Release publication requires signed APKs. Add the missing secrets under Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "Release signing secrets are unavailable; this validation run will build Android debug APKs signed with the standard debug key."
          fi

      - name: Configure release signing
        if: steps.signing.outputs.publish_release == 'true' && steps.signing.outputs.available == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p app/keystore
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > app/keystore/release.jks
          cat > signing.properties <<EOF
          keystore.path=app/keystore/release.jks
          keystore.pwd=${ANDROID_KEYSTORE_PASSWORD}
          keystore.alias=${ANDROID_KEY_ALIAS}
          keystore.alias_pwd=${ANDROID_KEY_PASSWORD}
          EOF
          echo "Release signing configured."

      - name: Build APKs
        shell: bash
        env:
          BUILD_TASKS: ${{ inputs.build_tasks }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${BUILD_TASKS}" ]]; then
            echo "Running custom Gradle tasks: ${BUILD_TASKS}"
            ./gradlew ${BUILD_TASKS}
          elif [[ "${{ steps.signing.outputs.publish_release }}" == "true" ]]; then
            echo "Building signed release APKs."
            ./gradlew :app:assembleDefaultRelease :app:assembleLiteRelease
          else
            echo "Building installable debug APKs."
            ./gradlew :app:assembleDefaultDebug :app:assembleLiteDebug
          fi

      - name: Collect APKs
        id: collect_apks
        shell: bash
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk -type f -name "*.apk" -print -exec cp {} release-apks/ \;
          if ! ls release-apks/*.apk >/dev/null 2>&1; then
            echo "No APK files were produced."
            exit 1
          fi
          ls -lh release-apks

      - name: Verify APK signatures
        shell: bash
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)/apksigner"
          for apk in release-apks/*.apk; do
            echo "Verifying ${apk}"
            "${APKSIGNER}" verify --verbose --print-certs "${apk}"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: release-apks/*.apk
          if-no-files-found: error

      - name: Upload APKs to GitHub Release
        if: steps.signing.outputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
          files: release-apks/*.apk
          generate_release_notes: true
